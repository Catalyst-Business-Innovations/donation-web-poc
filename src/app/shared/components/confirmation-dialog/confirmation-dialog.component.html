@if (isVisible()) {
  <div
    class="confirmation-dialog-backdrop"
    (click)="onBackdropClick($event)"
    (keydown)="onKeydown($event)"
  >
    <div
      class="confirmation-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialog-title"
    >
      <div class="dialog-header">
        <h3 id="dialog-title">{{ title() }}</h3>
      </div>
      <div class="dialog-body">
        <p>{{ message() }}</p>
        @if (showTextarea()) {
          <div class="textarea-container">
            @if (textareaLabel()) {
              <label for="dialog-textarea" class="form-label">
                {{ textareaLabel() }}
                @if (textareaRequired()) {
                  <span class="text-danger">*</span>
                }
              </label>
            }
            <textarea
              id="dialog-textarea"
              class="form-control"
              [class.is-invalid]="textareaRequired() && !textareaModel.trim()"
              rows="4"
              [placeholder]="textareaPlaceholder()"
              [ngModel]="textareaModel"
              (ngModelChange)="onTextareaChange($event)"
              [required]="textareaRequired()"
              [attr.aria-required]="textareaRequired()"
              aria-describedby="textarea-error"
            ></textarea>
            @if (textareaRequired() && !textareaModel.trim()) {
              <div id="textarea-error" class="invalid-feedback">This field is required</div>
            }
          </div>
        }
      </div>
      <div class="dialog-footer">
        <button class="btn btn-secondary" (click)="onCancel()">
          {{ cancelText() }}
        </button>
        <button
          [class]="'btn ' + confirmButtonClass()"
          (click)="onConfirm()"
          [disabled]="isConfirmDisabled()"
        >
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
