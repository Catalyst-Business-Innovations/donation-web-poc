<div class="chart-card">
  <div class="chart-title">Category Distribution</div>
  <div class="chart-sub">This month</div>
  <div class="donut-wrap">
    <svg viewBox="0 0 120 120" width="140" height="140">
      <circle cx="60" cy="60" r="50" fill="none" stroke="var(--gray-200)" stroke-width="20" />
      @for (seg of segments(); track seg.color) {
        <circle
          cx="60"
          cy="60"
          r="50"
          fill="none"
          [attr.stroke]="seg.color"
          stroke-width="20"
          [attr.stroke-dasharray]="seg.dash + ' ' + seg.gap"
          [attr.stroke-dashoffset]="seg.offset"
          transform="rotate(-90 60 60)"
        />
      }
      <text x="60" y="56" text-anchor="middle" font-size="14" font-weight="900" fill="var(--gray-900)">
        {{ totalDonations() | number }}
      </text>
      <text x="60" y="70" text-anchor="middle" font-size="8" fill="var(--gray-500)">total</text>
    </svg>
    <div class="donut-legend">
      @for (cat of categories(); track cat.categoryKey) {
        <div class="donut-legend-item">
          <div class="donut-dot" [style.--dot-color]="cat.color"></div>
          {{ cat.categoryName }} — {{ cat.percentage }}%
        </div>
      }
    </div>
  </div>
</div>
