<app-modal
  [open]="open()"
  title="Merge Containers"
  confirmLabel="Merge Containers"
  cancelLabel="Cancel"
  [showCancel]="true"
  (closed)="closed.emit()"
  (confirmed)="onConfirm()"
>
  @if (form(); as f) {
    <div class="merge-summary">
      Merging
      <strong>{{ selectionCount() }}</strong>
      containers
      <strong>{{ mergeTotal() }}</strong>
      combined items into one new container.
    </div>

    <div class="form-section-hdr form-section-hdr--spaced">New Container Properties</div>

    <div class="form-row-2">
      <div class="form-group">
        <label class="form-label">Container Type</label>
        <select
          class="form-select"
          [ngModel]="f.containerType"
          (ngModelChange)="formChanged.emit({ containerType: $event })"
        >
          <option [ngValue]="CT.Gaylord">Gaylord</option>
          <option [ngValue]="CT.CartRack">Cart / Z-Rack</option>
          <option [ngValue]="CT.Pallet">Pallet</option>
          <option [ngValue]="CT.Tote">Tote / Bin</option>
          <option [ngValue]="CT.Baler">Baler</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">
          Department
          <span class="form-required">*</span>
        </label>
        <select
          class="form-select"
          [ngModel]="f.deptKey"
          (ngModelChange)="formChanged.emit({ deptKey: $event, catKey: '' })"
        >
          <option value="">select</option>
          @for (d of departments(); track d.key) {
            <option [value]="d.key">{{ d.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-row-2">
      <div class="form-group">
        <label class="form-label">
          Category
          <span class="form-hint">optional</span>
        </label>
        <select
          class="form-select"
          [ngModel]="f.catKey"
          (ngModelChange)="formChanged.emit({ catKey: $event })"
          [disabled]="!f.deptKey"
        >
          <option value="">Any (dept-level)</option>
          @for (cat of deptCats(); track cat.key) {
            <option [value]="cat.key">{{ cat.name }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Destination</label>
        <select
          class="form-select"
          [ngModel]="f.destination"
          (ngModelChange)="formChanged.emit({ destination: $event })"
        >
          <option [ngValue]="null">TBD</option>
          <option [ngValue]="CD.Production">Production Floor</option>
          <option [ngValue]="CD.Reserve">Reserve / Backstock</option>
          <option [ngValue]="CD.Warehouse">Warehouse</option>
          <option [ngValue]="CD.Ecommerce">E-Commerce</option>
          <option [ngValue]="CD.Salvage">Salvage / Recycling</option>
          <option [ngValue]="CD.Transfer">Transfer to another store</option>
        </select>
      </div>
    </div>

    @if (f.destination === CD.Transfer) {
      <div class="form-group">
        <label class="form-label">
          Transfer To Store
          <span class="form-required">*</span>
        </label>
        <select
          class="form-select"
          [ngModel]="f.transferToLocationId"
          (ngModelChange)="formChanged.emit({ transferToLocationId: $event })"
        >
          <option value="">select store</option>
          @for (loc of locations(); track loc.id) {
            <option [ngValue]="loc.id">{{ loc.name }}</option>
          }
        </select>
      </div>
    }

    <div class="form-group form-group--spaced-xs">
      <label class="form-label">
        Notes
        <span class="form-hint">optional</span>
      </label>
      <textarea
        class="form-textarea"
        rows="2"
        [ngModel]="f.notes"
        (ngModelChange)="formChanged.emit({ notes: $event })"
        placeholder="Reason for merge"
      ></textarea>
    </div>

    <div class="merge-warning">
      <app-icon name="alert-circle" size="14" />
      The selected source containers will be marked as
      <strong>Disposed</strong>
      after merging.
    </div>
  }
</app-modal>
