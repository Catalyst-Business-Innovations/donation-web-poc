<div class="topbar containers-topbar">
  <div>
    <div class="topbar-title">Containers</div>
    <div class="topbar-subtitle">Track containers through the full production chain</div>
  </div>
  <div class="topbar-actions">
    <div class="search-bar containers-search">
      <span class="search-icon"><app-icon name="search" size="14" /></span>
      <input
        [ngModel]="query()"
        (ngModelChange)="queryChanged.emit($event)"
        placeholder="Search barcode, dept, or location..."
      />
    </div>
    <select class="form-select f-sel" [ngModel]="statusFilter()" (ngModelChange)="statusFilterChanged.emit($event)">
      <option [ngValue]="''">All Statuses</option>
      <option [ngValue]="CS.Available">Available</option>
      <option [ngValue]="CS.InUse">In Use</option>
      <option [ngValue]="CS.ReadyForSorting">Ready for Sorting</option>
      <option [ngValue]="CS.Sorting">Sorting</option>
    </select>
    <div class="topbar-divider"></div>
    @if (selectionCount() > 0) {
      <span class="sel-count">{{ selectionCount() }} selected</span>
      <button class="btn btn-secondary btn-sm" (click)="clearSelectionClicked.emit()">Deselect All</button>
      <button class="btn btn-secondary btn-sm" (click)="mergeClicked.emit()" [disabled]="selectionCount() < 2">
        Merge
      </button>
      <button class="btn btn-secondary btn-sm" (click)="bulkStatusClicked.emit()">Bulk Status</button>
    }
    <button class="btn btn-secondary" (click)="printLabelsClicked.emit()">Print Labels</button>
    <button class="btn btn-primary" (click)="createClicked.emit()">+ New Container</button>
  </div>
</div>
