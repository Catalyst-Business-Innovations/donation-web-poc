<div class="topbar">
  <div>
    <div class="topbar-title">My Donations</div>
    <div class="topbar-subtitle">
      {{ donor.totalDonations }} donations since {{ donor.joinDate | date: 'MMM yyyy' }}
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-secondary" (click)="onDownloadAll()">
      <app-icon name="download" [size]="14" class="icon-mr-sm"></app-icon>
      Download All
    </button>
  </div>
</div>

<div class="page-content">
  <app-history-filters [years]="years" [selectedYear]="selectedYear()" (yearChanged)="selectedYear.set($event)" />

  <app-history-summary-cards [summary]="summary()" (yearEndSummaryRequested)="onYearEndSummary()" />

  <app-history-list
    [donations]="filteredDonations()"
    [expandedId]="expandedId()"
    (toggled)="onToggle($event)"
    (downloadRequested)="onDownloadReceipt($event)"
  />
</div>
