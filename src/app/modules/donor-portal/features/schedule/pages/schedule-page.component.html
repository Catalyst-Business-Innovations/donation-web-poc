<div class="topbar">
  <div>
    <div class="topbar-title">Schedule Donation</div>
    <div class="topbar-subtitle">Add items to your cart, then choose a store and time</div>
  </div>
</div>

<div class="page-content">
  <div class="sched-grid">
    <app-cart-editor
      [items]="cart()"
      [categories]="categories"
      [totalItems]="totalCartItems"
      (itemAdded)="onAddCartItem($event)"
      (itemRemoved)="onRemoveCartItem($event)"
    />

    <div class="right-col">
      <app-schedule-form
        [locations]="locations"
        [timeSlots]="timeSlots"
        [today]="today"
        [(selectedLocation)]="selectedLocation"
        [(selectedDate)]="selectedDate"
        [(selectedTime)]="selectedTime"
        [(notes)]="notes"
        (submitRequested)="onSubmit()"
      />

      <app-upcoming-visits-list
        [visits]="upcoming"
        (visitSelected)="onViewVisit($event)"
        (cancelRequested)="onCancelVisit($event)"
      />
    </div>
  </div>
</div>

<app-visit-detail-modal [visit]="selectedVisit()" (closed)="onCloseVisitDetail()" />

<app-schedule-confirmation-modal
  [open]="showConfirmation()"
  [confirmation]="confirmation()"
  (closed)="onCloseConfirmation()"
/>
