<div class="card">
  <div class="card-header"><div class="card-title">Choose Store & Time</div></div>

  <div class="form-group">
    <label class="form-label">Store *</label>
    <select class="form-select" [(ngModel)]="selectedLocation">
      <option value="">Select a store...</option>
      @for (loc of locations(); track loc.id) {
        <option [value]="loc.id" [disabled]="loc.isClosed">
          {{ loc.name }} — {{ loc.address }} {{ loc.isClosed ? '(Closed)' : '' }}
        </option>
      }
    </select>
  </div>

  @if (selectedLocationDetail; as loc) {
    <div class="loc-preview">
      <div>
        <div class="loc-preview__name">{{ loc.name }}</div>
        <div class="loc-preview__meta">{{ loc.address }}</div>
        <div class="loc-preview__meta loc-preview__meta--hours">
          <app-icon name="clock" [size]="13"></app-icon>
          {{ loc.hours }}
        </div>
      </div>
      <span class="badge {{ loc.statusBadgeClass }}">{{ loc.statusLabel }}</span>
    </div>
  }

  <div class="date-time-grid">
    <div class="form-group">
      <label class="form-label">Date *</label>
      <input class="form-input" type="date" [(ngModel)]="selectedDate" [min]="today()" />
    </div>
    <div class="form-group">
      <label class="form-label">Preferred Time</label>
      <select class="form-select" [(ngModel)]="selectedTime">
        <option value="">Any time</option>
        @for (s of timeSlots(); track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Notes for Staff</label>
    <textarea
      class="form-input form-textarea"
      [(ngModel)]="notes"
      placeholder="e.g. 'Large furniture piece' or 'Blue SUV'"
    ></textarea>
  </div>
  <button
    class="btn btn-success btn-lg w-full"
    [disabled]="!selectedLocation() || !selectedDate()"
    (click)="submitRequested.emit()"
  >
    Schedule Donation
  </button>
</div>
